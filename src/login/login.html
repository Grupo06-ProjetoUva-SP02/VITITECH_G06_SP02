<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_login.css">
    <link rel="icon" type="image/svg+xml" href="../../assets/img/logo.svg">
    <title>Conecte-se</title>
</head>

<body>
    <header class="header">
        <div class="logo-container">
            <img src="../../assets/img/logo.svg" alt="">
            <H1 class="logo">VITITECH</h1>
        </div>


        <nav class="nav">
            <ul>
                <li><a href="../home/home.html">Home</a></li>
                <li><a href="../calculadora/calculadora.html">Calculadora</a></li>
                <li><a href="../home/home.html">Quem Somos</a></li>
                <li><a href="../home/home.html">Contato</a></li>
                </div>
                <div class="login">
                    <li><a href="../login/login.html">Login</a></li>
                    <img src="../../assets/img/user.svg" alt="Imagem do botão para logar">
                </div>
            </ul>
        </nav>
    </header>

    <div class="banner">
        <div class="formulario_login">
            <div class="title">
                <h1>Hora do <span>Login</span></h1>
                <p>Acesse os benefícios que a <span><b>VITITECH</b></span> te proporciona!</p>
            </div>
            <div class="containerInputs">
                <label for="ipt_email">E-mail:</label>
                <input type="text" id="ipt_email">
            </div>
            <div class="containerInputs">
                <label for="ipt_senha">Senha:</label>
                <input type="password" id="ipt_senha">
            </div>
            <div id="div_msg"></div>
            <button onclick="verificar()">Entrar</button>
            <div class="link_cadastro">
                Ainda não possui conta?
                <a href="../cadastro/cadastro.html">Clique aqui</a>

            </div>
        </div>
    </div>

    </div>
</body>

<script>

    // definindo variáveis

const login_fixo = 'cliente@gmail.com';
const senha_fixa = '123456';
let tentativas = 3;

let lista_de_erros = [];
let erro = 0;

function verificar() {
    let login = ipt_email.value;
    let senha = ipt_senha.value;

    // validação se possui tentaivas de erro

    if (tentativas > 0) {
        if (login === login_fixo && senha === senha_fixa) {
            div_msg.innerHTML = `Login válido!`

            window.location.href = '../visao_geral/visao_geral.html' // código utilizado para linkar páginas locais
        } else {
            lista_de_erros.push(erro)
            tentativas--
            div_msg.innerHTML = ``
            for (erro = 0; erro < lista_de_erros.length; erro++) {

                if (tentativas > 0) {
                    div_msg.innerHTML = `E-mail ou senha incorretos! Tentativas restantes: ${tentativas}. Tente novamente.<br>`
                } else {
                    div_msg.innerHTML = `Você atingiu o limite de tentativas!`
                }
            }
        }
    } else {
        div_msg.innerHTML = `Você atingiu o limite de tentativas!`
    }
}

</script>

</html>
