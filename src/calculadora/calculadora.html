<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_calculadora.css">
    <link rel="icon" type="image/svg+xml" href="../../assets/img/logo.svg">
    <title>VitiTech | Simulação Financeira</title>
</head>

<body>

    <header class="header">
        <div class="logo-container">
            <img src="../../assets/img/logo.svg" alt="">
            <H1 class="logo">VITITECH</h1>
        </div>


        <nav class="nav">
            <ul>
                <li><a href="../home/home.html">Home</a></li>
                <li><a href="../calculadora/calculadora.html">Calculadora</a></li>
                <li><a href="../home/home.html">Quem Somos</a></li>
                <li><a href="../home/home.html">Contato</a></li>
                </div>
                <div class="login">
                    <li><a href="../login/login.html">Login</a></li>
                    <img src="../../assets/img/user.svg" alt="Imagem do botão para logar">
                </div>
            </ul>
        </nav>
    </header>

    <div class="containerGeral">
        <div class="container">
            <h2 class="titulo">Simulação Financeira</h2>

            <div class="simulador">
                <label for="ipt_tamanhoVinhedo">Tamanho do vinhedo (hectares)</label>
                <input type="number" id="ipt_tamanhoVinhedo">

                <label for="ipt_valorUva">exemplar da uva</label>
                <select name="exemplar da uva" id="ipt_valorUva">
                    <option value="" disabled selected hidden>Exemplar da uva</option>
                    <option value="9"> Cabernet Sauvignon</option>
                    <option value="8">Tempranillo</option>
                    <option value="9">malbec</option>
                    <option value="11">Pinot noir</option>
                    <option value="8">Merlot </option>
                    <option value="10">Chardonnay</option>
                </select>

                <label for="ipt_produtividadeMedia">Produtividade média anual (Kg)</label>
                <input type="number" id="ipt_produtividadeMedia">



                <button onclick="calcular()">Simular</button>

                <div id="div_resul"></div>
            </div>
        </div>
    </div>



</body>

</html>

<script>
    function calcular() {
        let tamanho = Number(ipt_tamanhoVinhedo.value);
        let valor = Number(ipt_valorUva.value);
        let produtividade = Number(ipt_produtividadeMedia.value);
        let condicao = 0.37
        let viti_tech = 1
        let faturamentoIdeal = tamanho * valor * produtividade;
        let prejuizo = 0;


        if (viti_tech == 1) {
            prejuizo = faturamentoIdeal * 0.37;
        }

        let faturamentoReal = faturamentoIdeal - prejuizo;

        div_resul.innerHTML = `
                Faturamento ideal: R$ ${faturamentoIdeal.toFixed(2)}<br>
                Prejuízo  estimado e de cerca de: R$ ${prejuizo.toFixed(2)}<br><br>
                <strong>Faturamento real: R$ ${faturamentoReal.toFixed(2)}</strong>
            `;
    }
</script>
