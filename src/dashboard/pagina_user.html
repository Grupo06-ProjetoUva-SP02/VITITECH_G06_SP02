<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="#">
    <link rel="icon" type="image/svg+xml" href="../../assets/img/logo.svg">
    <link rel="stylesheet" href="dashboard.css">
    <!-- Importa o script do chartJS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Perfil Vititech</title>
</head>

<body>

    <div class="janela">

        <div class="header-left">

            <div class="title">
                <div class="icon">
                    <img src="../../assets/img/logo.svg" alt="">
                </div>
                <h1>Vititech</h1>

            </div>

            <div class="btn-nav">
                <div class="icon">
                    <img src="../../assets/img/visao_geral.svg" alt="">
                </div>
                <h3>Visão Geral</h3>
            </div>

            <div class="btn-nav-white">
                <div class="icon">
                    <img src="../../assets/img/baias.svg" alt="">
                </div>
                <a href="#">
                    <h3>Baias</h3>
                </a>
            </div>

            <div class="btn-nav-white">
                <div class="icon">
                    <img src="../../assets/img/alerta.svg" alt="">
                </div>
                <a href="#">
                    <h3>Alertas</h3>
                </a>
            </div>

            <div class="btn-nav-white">
                <div class="icon">
                    <img src="../../assets/img/relatorio.svg" alt="">
                </div>
                <a href="#">
                    <h3>Relatórios</h3>
                </a>
            </div>

            <div class="btn-nav-white">
                <div class="icon">
                    <img src="../../assets/img/configuracao.svg" alt="">
                </div>
                <a href="#">
                    <h3>Configurações</h3>
                </a>
            </div>

            <div class="btn-nav-white">
                <div class="icon">
                    <img src="../../assets/img/user.svg" alt="">
                </div>
                <a href="#">
                    <h3>Usuário</h3>
                </a>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <div class="icon">
                    <img src="../../assets/img/icone_sair.svg" alt="">
                </div>
                <h3>Sair</h3>
            </div>

        </div>

        <div class="header right">

            <div class="title">
                <h2>Baias</23>
            </div>

            <div class="card">
                <div class="container">
                    <h3>01</h3>
                </div>
                <h3>Baia 01 | 21%</h3>
            </div>

            <div class="card">
                <div class="container">
                    <h3>02</h3>
                </div>
                <h3>Baia 02 | 21%</h3>
            </div>

            <div class="card">
                <div class="container">
                    <h3>03</h3>
                </div>
                <h3>Baia 03 | 21%</h3>
            </div>
        </div>

        <div class="kpi1">
            <div class="container">
                <img src="../../assets/img/icone_bola.svg" alt="">
                <img src="../../assets/img/umidade.svg" alt="">

            </div>
            <h3>Umidade Atual</h3>
            <h1>21%</h1>
            <h3>Abaixo da faixa ideal</h3>
        </div>

        <div class="kpi2">
            <div class="container">
                <img src="../../assets/img/icone_bola.svg" alt="">
                <img src="../../assets/img/seta_aumento.svg" alt="">
            </div>
            <h3>Crescimento da umidade do solo</h3>
            <h1>+15,03%</h1>
        </div>

        <div class="kpi3">
            <div class="container">
                <img src="../../assets/img/icone_bola.svg" alt="">
                <img src="../../assets/img/umidade.svg" alt="">

            </div>
            <h3>Faixa de umidade no solo ideal</h3>
            <h1>40% - 70%</h1>
        </div>
    </div>

    <div id="grafico1" style="height:50vh; width:900vw">
        <canvas id="umidadePeriodo"></canvas>
    </div>
    <div id="grafico2" style="position: relative; height:40vh; width:80vw">
        <canvas id="mediaPeriodo"></canvas>
    </div>

    </div>

</body>

</html>

<script>
  const umidadePeriodo = document.getElementById('umidadePeriodo');
  const mediaPeriodo = document.getElementById('mediaPeriodo');

  new Chart(umidadePeriodo, {
    type: 'line',
    data: {
      labels: ['10:00', '11:00', '12:00', '13:00','14:00','15:00'],
      datasets: [{
        label: 'Umidade do solo por período',
        data: [50, 60, 70, 80,50,70],
        borderWidth: 3,
        borderColor: '#8d4899',
        backgroundColor: '#8d4899',
      }]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });

  new Chart(mediaPeriodo, {
    type: 'bar',
    data: {
      labels: ['10:00', '11:00', '12:00', '13:00','14:00','15:00'],

      // define os dados do gráfico de barras
      datasets: [{
        label: 'Umidade mínima',
        data: [50, 60, 70, 80,60,70],
        backgroundColor: 'green',
        borderRadius: 5
      },
      {
        // dados da média
        label: 'Média da umidade do solo (%)',
        data: [55, 65, 75, 85,55,75],
        borderWidth: 1,
        backgroundColor: '#8d4899',
        borderRadius: 5
      },
      {
        label: 'Umidade máxima',
        data: [60, 70, 80, 90,70,85],
        borderWidth: 1,
        backgroundColor: 'red',
        borderRadius: 5
      }]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });
</script>
