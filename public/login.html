<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_login.css">
    <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg">
    <script src="./js/sessao.js"></script>
    <title>Conecte-se</title>
</head>

<body>
    <header class="header">

        <div class="logo-container">
            <img src="/assets/img/logo.svg" alt="">
            <H1 class="logo">VITITECH</h1>
        </div>


        <nav class="nav">
            <ul>
                <li><a href="/home.html">Home</a></li>
                <li><a href="/calculadora.html">Calculadora</a></li>
                <li><a href="/home.html">Quem Somos</a></li>
                <li><a href="/home.html">Contato</a></li>
                </div>
                <div class="login">
                    <li><a href="/login.html">Login</a></li>
                    <img src="/assets/img/user.svg" alt="Imagem do botão para logar">
                </div>
            </ul>
        </nav>
    </header>

    <div class="banner">
<div class="formulario_login">

    <div class="title">
        <h1>Hora do <span>Login</span></h1>
        <p>Acesse os benefícios que a <span><b>VITITECH</b></span> te proporciona!</p>
    </div>

    <!-- MENSAGEM DE ERRO -->
    <div class="alerta_erro">
        <div class="card_erro" id="cardErro" style="display: none;">
            <span id="mensagem_erro"></span>
        </div>
    </div>

    <!-- INPUTS -->
    <div class="containerInputs">
        <label for="ipt_email">E-mail:</label>
        <input type="text" id="ipt_email">
    </div>

    <div class="containerInputs">
        <label for="ipt_senha">Senha:</label>
        <input type="password" id="ipt_senha">
    </div>

    <div id="div_msg"></div>

    <button onclick="verificar()">Entrar</button>

    <div class="link_cadastro">
        Ainda não possui conta?
        <a href="/cadastro.html">Clique aqui</a>
    </div>

    <div id="div_aguardar" class="loading-div">
        <img src="./assets/icon/circle-loading.gif" id="loading-gif" />
    </div>

</div>
    </div>
</body>

<script>

let tentativas = 3;

function verificar() {
    let emailVar = ipt_email.value;
    let senhaVar = ipt_senha.value;

    // validação se possui tentaivas de erro

    if (tentativas <= 0) {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "Acesso bloqueado!"
        setTimeout(sumirMensagem, 5000);
        return false;  
    } 

    if (emailVar == "" || senhaVar == "") {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML =
            "Todos os campos devem ser preenchidos!";
        return false; // encerra a função, o fetch não roda
    } else {
        setTimeout(sumirMensagem, 5000);
    }

    aguardar();

fetch("/usuarios/autenticar", {
        method: "POST",
        headers: {
        "Content-Type": "application/json",
        },
        body: JSON.stringify({
            emailServer: emailVar,
            senhaServer: senhaVar,
        }),
    }) .then(function (resposta) {
        console.log("ESTOU NO THEN DO entrar()!");
        if (resposta.ok && tentativas > 0) {
            console.log(resposta);

            resposta.json().then((json) => {
                console.log(json);
                console.log(JSON.stringify(json));
                sessionStorage.ID_USUARIO = json.idUsuario;
                sessionStorage.NOME_USUARIO = json.nome;
                sessionStorage.EMAIL_USUARIO = json.email;

                setTimeout(function () {
                window.location = "./visao_geral.html";
                }, 1000); 
            });
        } else if (resposta.status == 403) { // email ou senha não estão coerentes com o que está no banco
            tentativas--;

            finalizarAguardar();
            cardErro.style.display = "block";
            if (tentativas <= 0) {
                mensagem_erro.innerHTML = "Acesso bloqueado!"
            } else {
                if (senhaVar != sessionStorage.SENHA) {
                    mensagem_erro.innerHTML = "Senha Inválida! Você tem: " + tentativas + " tentativa(s)";
                } else if (senhaVar != sessionStorage.EMAIL_USUARIO) {
                    mensagem_erro.innerHTML = "Email Inválido! Você tem: " + tentativas + " tentativa(s)";
                }
            }
            setTimeout(sumirMensagem, 5000);
        } else {
            console.log("Houve um erro ao tentar realizar o login!");

            resposta.text().then((texto) => {
                console.error(texto);
                finalizarAguardar(texto);
            });
        }
    }) .catch(function (erro) {
        console.log(erro);
        finalizarAguardar();
    });

    return false;
}

  function sumirMensagem() {
    cardErro.style.display = "none";

}

</script>

</html>
