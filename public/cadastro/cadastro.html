<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_cadastro.css">
    <link rel="icon" type="image/svg+xml" href="../../assets/img/logo.svg">
    <title>Cadastre-se</title>
</head>

<body>
    <header class="header">
        <div class="logo-container">
            <img src="../../assets/img/logo.svg" alt="">
            <h1 class="logo">VITITECH</h1>
        </div>

        <nav class="nav">
            <ul>
                <li><a href="../home/home.html">Home</a></li>
                <li><a href="../calculadora/calculadora.html">Calculadora</a></li>
                <li><a href="../home/home.html">Quem Somos</a></li>
                <li><a href="../cadastro/cadastro.html">Contato</a></li>
                <div class="login">
                    <li><a href="../login/login.html">Login</a></li>
                    <img src="../../assets/img/user.svg" alt="Imagem do botão para logar">
                </div>
            </ul>
        </nav>
    </header>

    <div class="banner">
        <div class="formulario_cadastro">
            <div class="title">
                <span>Cadastre-se</span>
            </div>

            <div class="container_inputs">
                <label for="ipt_codigo">Código de ativação:</label>
                <input type="text" id="ipt_codigo" placeholder="Insira o código de ativação fornecido"
                    onkeyup="verificarEmail()">
            </div>

            <div class="container_inputs">
                <label for="ipt_telefone">Nome:</label>
                <input type="text" placeholder="Insira seu nome" id="ipt_nome">
            </div>

            <div class="container_inputs">
                <label for="ipt_email">E-mail:</label>
                <input type="text" id="ipt_email" placeholder="Insira seu email" onkeyup="verificarEmail()">
            </div>

            <div id="emailValidacao"></div>


            <div class="container_inputs">
                <label for="ipt_CPF">CPF:</label>
                <input type="text" placeholder="Insira seu CPF" id="ipt_CPF">
            </div>

            <div class="container_inputs">
                <label for="ipt_senha">Senha:</label>
                <input type="password" id="ipt_senha" placeholder="Insira sua senha" onkeyup="verificarSenha()">
                <div id="divSenha">A senha deve ter mais que 8 caracteres, uma letra maiúscula e uma mínuscula</div>
                <br>
            </div>


            <div class="container_inputs">
                <label for="ipt_confirmarSenha">Confirmar senha:</label>
                <input type="password" id="ipt_confirmarSenha" placeholder="Confirme sua senha">
            </div>

            <button onclick="verificar()">Cadastrar</button>
            <div class="link_cadastro">
                Já possui uma conta?
                <a href="../login/login.html">Clique aqui</a>
            </div>
        </div>
    </div>

    </div>
</body>
<script>
        function verificar() {
            let codigo = ipt_codigo.value
            let email = ipt_email.value
            let cpf = ipt_CPF.value
            let nome = ipt_nome.value
            let senha = ipt_senha.value
            let confirmarSenha = ipt_confirmarSenha.value
            let indice_com = email.indexOf('.com')
            let indice_arroba = email.indexOf('@')
            let arroba_antes_com = indice_arroba < indice_com
            let comeca_com_arroba = email.startsWith('@')
            let contem_espaco = email.includes(' ')

            if (codigo == "" || email == "" || cpf == "" || nome == "" || senha == "" || confirmarSenha == "") {
                alert(`Preencha todos os campos!`)
            } else if (codigo != "CODIGO1" && codigo != "CODIGO2" && codigo != "CODIGO3") {
                alert(`Código de ativação inválido!`)
            } else if (indice_com == -1 || indice_arroba == -1 || !arroba_antes_com || comeca_com_arroba || contem_espaco) {
                alert(`E-mail inválido!`)
            } else if (cpf.length != 11) {
                alert(`CPF inválido!`)
            } else if (senha.length < 8 || senha == senha.toUpperCase() || senha == senha.toLowerCase()) {
                alert(`Senha inválida!`)
            } else if (senha != confirmarSenha) {
                alert(`As senhas não coincidem!`)
            } else {
                alert(`Cadastro realizado com sucesso!`)
            }
        }
    

</script>

</html>
