<script>


const login_fixo = 'cliente@gmail.com';
const senha_fixa = '123456';

let tentativas = 3;

 function entrar() {
        aguardar();

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (tentativas <= 0) {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = 'Acesso Bloqueado!'
            setTimeout(sumirMensagem, 5000);
            return false;
        }

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok && tentativa > 0) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.SENHA_USUARIO = json.senha;
                    sessionStorage.EMPRESA_USUARIO = json.fkEmpresa;

                    //  cpf senha fkEmpresa

                    setTimeout(function () {
                        window.location = "./dashboard/cards.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else if (resposta.status == 403) { // email ou senha não estão coerentes com o que está no banco
                tentativas --;

                finalizarAguardar();
                cardErro.style.display = "block";
                    if (tentativas <= 0) {
                        mensagem_erro.innerHTML = "Acesso bloqueado!"
                    } else if (emailVar != email) {
                        mensagem_erro.innerHTML = "Email Incorreto! Você tem: " + tentativas + " tentativa(s)";
                    } else {
                        mensagem_erro.innerHTML = "Senha Incorreta! Você tem: " + tentativas + " tentativa(s)";
                    }
            } else {
                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

function sumirMensagem() {
    cardErro.style.display = "none"
}

</script>
