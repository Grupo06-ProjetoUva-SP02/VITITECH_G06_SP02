<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style_cadastro.css">
    <link rel="icon" type="image/svg+xml" href="./assets/img/logo.svg">
    <script src="./js/sessao.js"></script>
    <title>Cadastre-se</title>
</head>

<body onload="listar()">
    <header class="header">
        <div class="logo-container">
            <img src="./assets/img/logo.svg" alt="">
            <h1 class="logo">VITITECH</h1>
        </div>

        <nav class="nav">
            <ul>
                <li><a href="./home.html">Home</a></li>
                <li><a href="./calculadora.html">Calculadora</a></li>
                <li><a href="./home.html">Quem Somos</a></li>
                <li><a href="./cadastro.html">Contato</a></li>
                <div class="login">
                    <li><a href="./login.html">Login</a></li>
                    <img src="./assets/img/user.svg" alt="Imagem do botão para logar">
                </div>
            </ul>
        </nav>
    </header>

    <div class="banner">
        <div class="alerta_erro">
            <div class="card_erro" id="cardErro" style="display: none;">
                <span id="mensagem_erro"></span>
            </div>
        </div>

        <div class="formulario_cadastro">
            <div class="title">
                <span>Cadastre-se</span>
            </div>

            <div class="container_inputs">
                <label for="ipt_codigo">Código de ativação:</label>
                <input type="text" id="ipt_codigo" placeholder="Insira o código de ativação fornecido">
            </div>

            <div class="container_inputs">
                <label for="ipt_nome">Nome:</label>
                <input type="text" placeholder="Insira seu nome" id="ipt_nome">
            </div>

            <div class="container_inputs">
                <label for="ipt_email">E-mail:</label>
                <input type="text" id="ipt_email" placeholder="Insira seu email">
            </div>

            <div id="emailValidacao"></div>

            <div class="container_inputs">
                <label for="ipt_CPF">CPF:</label>
                <input type="text" placeholder="Insira seu CPF" id="ipt_CPF">
            </div>

            <div class="container_inputs">
                <label for="ipt_senha">Senha:</label>
                <input type="password" id="ipt_senha" placeholder="Insira sua senha">
                <div id="divSenha">A senha deve ter mais que 8 caracteres, uma letra maiúscula e uma minúscula</div>
                <br>
            </div>

            <div class="container_inputs">
                <label for="ipt_confirmarSenha">Confirmar senha:</label>
                <input type="password" id="ipt_confirmarSenha" placeholder="Confirme sua senha">
            </div>

            <button onclick="cadastrar()">Cadastrar</button>
            <div class="link_cadastro">
                Já possui uma conta?
                <a href="./login.html">Clique aqui</a>
            </div>
        </div>
    </div>
</body>

</html>

<script>
    let listaEmpresasCadastradas = [];

    function cadastrar() {
        var nomeVar = ipt_nome.value;
        var emailVar = ipt_email.value;
        var cpfVar = ipt_CPF.value;
        var senhaVar = ipt_senha.value;
        var confirmacaoSenhaVar = ipt_confirmarSenha.value;
        var codigoVar = ipt_codigo.value;
        var idEmpresaVincular;

        if (
            nomeVar == "" ||
            emailVar == "" ||
            cpfVar == "" ||
            senhaVar == "" ||
            confirmacaoSenhaVar == "" ||
            codigoVar == ""
        ) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = "Preencha todos os campos em branco!";
            setTimeout(sumirMensagem, 5000);
            return false;
        } else if (
            nomeVar.length < 2 ||
            !emailVar.includes('@') ||
            !emailVar.includes('.') ||
            senhaVar.length <= 8 ||
            confirmacaoSenhaVar != senhaVar ||
            cpfVar.length != 11
        ) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = "Um dos campos está inválido! Verifique os requisitos.";
            setTimeout(sumirMensagem, 5000);
            return false;
        }

        // Verificando se o código de ativação é de alguma empresa cadastrada
        for (let i = 0; i < listaEmpresasCadastradas.length; i++) {
            if (listaEmpresasCadastradas[i].cod_ativacao == codigoVar) {
                idEmpresaVincular = listaEmpresasCadastradas[i].idEmpresa;
                console.log("Código de ativação válido.");
                break;
            }
        }

        // Se saiu do loop sem encontrar o código, exibe erro e para o cadastro
        if (!idEmpresaVincular) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = "Código de ativação inválido!";
            setTimeout(sumirMensagem, 5000);
            return false;
        }

        fetch("/usuarios/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                nomeServer: nomeVar,
                cpfServer: cpfVar,
                emailServer: emailVar,
                senhaServer: senhaVar,
                idEmpresaVincularServer: idEmpresaVincular
            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {
                    cardErro.style.display = "block";
                    mensagem_erro.innerHTML =
                        "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

                    setTimeout(() => {
                        window.location = "./login.html";
                    }, 2000);
                } else {
                    throw "Houve um erro ao tentar realizar o cadastro!";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
            });

        return false;
    }

    function listar() {
        fetch("/empresas/listar", {
            method: "GET",
        })
            .then(function (resposta) {
                resposta.json().then((empresas) => {
                    empresas.forEach((empresa) => {
                        listaEmpresasCadastradas.push(empresa);
                    });
                });
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
            });
    }

    function sumirMensagem() {
        cardErro.style.display = "none";
    }
</script>
